name: "Discord Commits"
description: "GitHub Action for Discord that prints commit messages."
branding:
  icon: "bell"
  color: "purple"
inputs:
  webhook:
    description: "discord webhook url without /github"
    required: true
  webhook_all:
    descrition: "discord webhook url without /github, all commits including redacted will be sent here"
    required: false
  message:
    description: "A general message that is displayed for all commits."
  embed:
    description: "JSON string that accepts double braces for templating."
  url:
    description: "The url of the commit diff"
  icon_url:
    description: "The icon url of the author for the header message"
  author:
    description: "The author for the header message"

runs:
  using: "node16"
  main: "index.js"
